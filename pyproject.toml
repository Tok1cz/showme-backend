[tool.poetry]
name = "showme-backend"
version = "0.1.0"
description = "Tourist POI backend"
authors = ["Your Name <you@example.com>"]

[[tool.poetry.packages]]
include = "app"
from = "."

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "*"
uvicorn = {extras = ["standard"], version = "*"}
sqlalchemy = "*"
asyncpg = "*"
geoalchemy2 = "*"
python-dotenv = "*"
pydantic = "*"
pydantic-settings = "^2.10.1"
psycopg2-binary = "^2.9.10"
celery = {extras = ["redis"], version = "^5.5.3"}
jinja2 = "^3.1.6"
openai = "^1.95.1"
alembic = "^1.16.4"
fastapi-users = {extras = ["oauth", "sqlalchemy"], version = "^14.0.1"}
fastapi-users-db-sqlalchemy = "^7.0.0"
httpx-oauth = "^0.16.1"
osmium = "^4.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
httpx = "*"
pytest-cov = "*"
pytest-mock = "*"
pytest-postgresql = "*"
black = "*"
isort = "*"
mypy = "*"