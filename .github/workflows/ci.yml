name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
      DATABASE_URL_SYNCH: "postgresql://test:test@localhost:5432/test"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      CELERY_BACKEND_URL: "redis://localhost:6379/0"
      OPEN_API_KEY: "test-key"
      GOOGLE_CLIENT_ID: "test-client-id"
      GOOGLE_CLIENT_SECRET: "test-client-secret"
      JWT_SECRET: "test-jwt-secret"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Check formatting with Black
        run: poetry run black --check app tests

      - name: Check import ordering with isort
        run: poetry run isort --check-only app tests

      - name: Create required directories
        run: mkdir -p images audio

      - name: Run tests with pytest
        run: poetry run pytest tests/ --ignore=tests/test_endpoints.py -v --tb=short
